# =============================================================================
# CyberShield AI - Spark defaults (mounted into spark-master / spark-worker)
# =============================================================================

# -- Cluster ---------------------------------------------------------------
spark.master                        spark://spark-master:7077

# -- Storage: use HDFS for all datasets and model artifacts -----------------
spark.hadoop.fs.defaultFS           hdfs://namenode:8020
spark.hadoop.dfs.replication        1

# -- Serialization ----------------------------------------------------------
spark.serializer                    org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled          true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.shuffle.partitions        8

# -- Event logging (job history lives on HDFS) ------------------------------
spark.eventLog.enabled              true
spark.eventLog.dir                  hdfs://namenode:8020/cybershield/spark-logs

# -- Resources (single-worker local cluster) --------------------------------
spark.driver.memory                 1g
spark.executor.memory               1g
spark.executor.cores                1
spark.cores.max                     2

# -- Structured Streaming tuning --------------------------------------------
spark.sql.streaming.checkpointLocation   hdfs://namenode:8020/cybershield/checkpoints
spark.streaming.stopGracefullyOnShutdown true
