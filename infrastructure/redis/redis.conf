# =============================================================================
# CyberShield AI - Redis configuration
# Hot cache for alert state, dedup keys, and WebSocket pub/sub fan-out.
# =============================================================================

# -- Networking -------------------------------------------------------------
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0

# -- Persistence: AOF for durability with lightweight RDB snapshots ---------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
dir /data

save 900 1
save 300 10
save 60 10000

# -- Memory: bounded cache, evict least-recently-used keys ------------------
maxmemory 256mb
maxmemory-policy allkeys-lru

# -- Slow query visibility --------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# -- Safety -----------------------------------------------------------------
# No password inside the private docker network; the port is not intended to
# be exposed publicly. For production, set requirepass + TLS.
enable-debug-command no
