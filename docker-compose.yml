# =============================================================================
# CyberShield AI - Big Data Cyber Attack Detection Platform
# Full local stack: Hadoop (HDFS) - Kafka - Spark - PostgreSQL - Redis
#                   - FastAPI backend - Next.js frontend
#
# Usage:
#   cp .env.example .env        # optional, safe defaults are inlined below
#   docker compose up -d --build
#
# Web UIs:
#   HDFS NameNode  http://localhost:9870
#   Spark Master   http://localhost:8080
#   Backend API    http://localhost:8000/docs
#   Frontend       http://localhost:3000
# =============================================================================
name: cybershield-ai

services:
  # ---------------------------------------------------------------------------
  # HADOOP / HDFS - distributed storage layer (raw + processed datasets)
  # ---------------------------------------------------------------------------
  namenode:
    image: apache/hadoop:3
    container_name: cybershield-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # NameNode Web UI
      - "8020:8020"   # HDFS RPC
    environment:
      HADOOP_HOME: /opt/hadoop
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
      # Environment-driven Hadoop configuration (processed by the image entrypoint)
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
      CORE-SITE.XML_hadoop.tmp.dir: /tmp/hadoop-root
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.permissions.enabled: "true"
      HDFS-SITE.XML_dfs.namenode.rpc-address: "namenode:8020"
      HDFS-SITE.XML_dfs.namenode.http-address: "0.0.0.0:9870"
      HDFS-SITE.XML_dfs.datanode.data.dir: /tmp/hadoop-root/dfs/data
      HDFS-SITE.XML_dfs.webhdfs.enabled: "true"
    volumes:
      - hdfs_namenode:/tmp/hadoop-root/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9870'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - cybershield-network

  datanode:
    image: apache/hadoop:3
    container_name: cybershield-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_HOME: /opt/hadoop
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
      CORE-SITE.XML_hadoop.tmp.dir: /tmp/hadoop-root
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.datanode.data.dir: /tmp/hadoop-root/dfs/data
    volumes:
      - hdfs_datanode:/tmp/hadoop-root/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9866'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - cybershield-network

  # ---------------------------------------------------------------------------
  # KAFKA - event streaming backbone
  #   internal listener: kafka:9092    (other containers)
  #   external listener: localhost:29092 (host machine clients)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cybershield-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - cybershield-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cybershield-kafka
    hostname: kafka
    ports:
      - "9092:9092"     # internal (docker network)
      - "29092:29092"   # external (host machine)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - cybershield-network

  # ---------------------------------------------------------------------------
  # SPARK - distributed processing layer (reads/writes HDFS)
  # ---------------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5
    container_name: cybershield-spark-master
    hostname: spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT_NUMBER: "7077"
      SPARK_MASTER_WEBUI_PORT_NUMBER: "8080"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark master RPC
    volumes:
      - ./infrastructure/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - ./streaming:/opt/cybershield/streaming:ro
      - ./ml:/opt/cybershield/ml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - cybershield-network

  spark-worker:
    image: bitnami/spark:3.5
    container_name: cybershield-spark-worker
    hostname: spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: "spark://spark-master:7077"
      SPARK_WORKER_MEMORY: "2g"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_WEBUI_PORT_NUMBER: "8081"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    volumes:
      - ./infrastructure/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - ./streaming:/opt/cybershield/streaming:ro
      - ./ml:/opt/cybershield/ml:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - cybershield-network

  # ---------------------------------------------------------------------------
  # POSTGRESQL - operational + analytical metadata store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cybershield-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybershield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybershield_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cybershield}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybershield} -d ${POSTGRES_DB:-cybershield}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - cybershield-network

  # ---------------------------------------------------------------------------
  # REDIS - hot cache, alert dedup, pub/sub for WebSocket fan-out
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cybershield-redis
    hostname: redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - cybershield-network

  # ---------------------------------------------------------------------------
  # BACKEND - FastAPI REST + WebSocket API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield-backend
    hostname: backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybershield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybershield_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cybershield}
      DATABASE_URL: ${DATABASE_URL:-postgresql://cybershield:cybershield_secret@postgres:5432/cybershield}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_EXTERNAL_SERVERS: ${KAFKA_EXTERNAL_SERVERS:-localhost:29092}
      HDFS_NAMENODE_URL: ${HDFS_NAMENODE_URL:-hdfs://namenode:8020}
      HDFS_WEB_URL: ${HDFS_WEB_URL:-http://namenode:9870}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    networks:
      - cybershield-network

  # ---------------------------------------------------------------------------
  # FRONTEND - Next.js SOC dashboard
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: cybershield-frontend
    hostname: frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cybershield-network

# -----------------------------------------------------------------------------
# Shared network
# -----------------------------------------------------------------------------
networks:
  cybershield-network:
    name: cybershield-network
    driver: bridge

# -----------------------------------------------------------------------------
# Persistent volumes
# -----------------------------------------------------------------------------
volumes:
  hdfs_namenode:
    name: cybershield-hdfs-namenode
  hdfs_datanode:
    name: cybershield-hdfs-datanode
  postgres_data:
    name: cybershield-postgres-data
  redis_data:
    name: cybershield-redis-data
  kafka_data:
    name: cybershield-kafka-data
  zookeeper_data:
    name: cybershield-zookeeper-data
